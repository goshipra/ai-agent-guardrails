[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-guardrails"
version = "0.1.0"
description = "A tool-agnostic policy layer that intercepts and blocks destructive commands proposed by autonomous AI coding agents, with full audit logging."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shipra Rathore" }]
requires-python = ">=3.9"
keywords = ["ai-safety", "guardrails", "policy-engine", "autonomous-agents", "claude-code"]
dependencies = [
    "pyyaml>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/goshipra/ai-agent-guardrails"
Repository = "https://github.com/goshipra/ai-agent-guardrails"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
guard = "guardrails.cli:main"

[tool.setuptools.packages.find]
include = ["guardrails*"]

[tool.setuptools.package-data]
guardrails = ["*.yaml"]
